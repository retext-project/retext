name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        environment:
          - py39-pyqt67-ubuntu2204
          - py39-windows
          - py311-pyqt68-ubuntu
          - py312-pyqt610-ubuntu
          - py313-pyqt611-ubuntu2404
          - py314-pyqt612-ubuntu
          - py315-ubuntu
        include:
          - environment: py39-pyqt67-ubuntu2204
            python: 3.9
            pyqt: PyQt6~=6.7.0 PyQt6-Qt6~=6.7.0
            platform: ubuntu-22.04
          - environment: py39-windows
            python: 3.9
            pyqt: PyQt6
            platform: windows-latest
          - environment: py311-pyqt68-ubuntu
            python: '3.11'
            pyqt: PyQt6~=6.8.0 PyQt6-Qt6~=6.8.0
            platform: ubuntu-latest
          - environment: py312-pyqt610-ubuntu
            python: '3.12'
            pyqt: PyQt6~=6.10.0 PyQt6-Qt6~=6.10.0
            platform: ubuntu-latest
          - environment: py313-pyqt611-ubuntu2404
            python: '3.13'
            pyqt: PyQt6~=6.11.0 PyQt6-Qt6~=6.11.0
            platform: ubuntu-24.04
          - environment: py314-pyqt612-ubuntu
            python: '3.14'
            pyqt: PyQt6~=6.12.0 PyQt6-Qt6~=6.12.0
            platform: ubuntu-latest
          - environment: py315-ubuntu
            python: '3.15'
            pyqt: PyQt6
            platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install apt dependencies
        if: ${{ startsWith(matrix.platform, 'ubuntu') }}
        run: |
          sudo apt update
          sudo apt install libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-cursor0 libxcb-xinerama0
          sudo apt install libegl1 libxkbcommon-x11-0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: |
          python -m pip install ${{ matrix.pyqt }} Markdown pymdown-extensions docutils chardet Markups Pygments
      - name: Run tests in Xvfb
        if: ${{ startsWith(matrix.platform, 'ubuntu') }}
        run: xvfb-run -a -s "-screen 0 1024x768x24" python -m unittest discover -s tests -v
      - name: Run tests
        if: ${{ !startsWith(matrix.platform, 'ubuntu') }}
        run: python -m unittest discover -s tests -v
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff check
        run: ruff check --select F,E,W,I,UP --line-length=106 --target-version=py39 .
